name: medguard
description: "MedGuard — Mobile app for plasma transport monitoring."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  material_symbols_icons: ^4.2.1077
  go_router: ^17.1.0
  intl: ^0.20.2
  fl_chart: ^0.70.1
